name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# A pull request's new push cancels its older run. Each master push gets its own
# group: a shared group would still let a newer push cancel a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run hermetic browser tests
        run: npm run test:e2e -- --shard ${{ matrix.shard }}/${{ strategy.job-total }} --reporter=line,blob

      - name: Upload browser test blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser test failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Required check "E2E": passes only when every shard passed, and merges the
  # shard blob reports into the single HTML report that used to be uploaded.
  e2e:
    name: E2E
    needs: [e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard: $RESULT"
          test "$RESULT" = success

      # Only package-lock.json is needed: it pins the Playwright that merges
      # the shard blob reports, so this job skips npm ci.
      - name: Check out package-lock.json
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Download blob reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true

      # One blob per entry of the e2e-shard matrix above.
      - name: Require every shard blob report
        if: always()
        run: |
          ls all-blob-reports
          test "$(find all-blob-reports -name '*.zip' | wc -l)" -eq 3

      - name: Merge shard reports
        if: always()
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          npx --yes "playwright@$version" merge-reports --reporter html,line ./all-blob-reports

      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

  flows-target:
    name: e2e flows (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        target: [desktop, phone, desktop-west]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Typecheck e2e config and flows
        run: npm run typecheck:e2e
      - name: Install e2e engine Chromium
        run: npx e2e-web install chromium --with-deps
      - name: Run ${{ matrix.target }} flows without model credentials
        run: npm run test:flows -- --target ${{ matrix.target }}
      - name: Upload e2e report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-flow-evidence-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/summary.md
            .e2e/results/
          if-no-files-found: warn
          retention-days: 14

  # Required check "e2e flows": passes only when every target leg passed.
  flows:
    name: e2e flows
    needs: [flows-target]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every target to pass
        env:
          RESULT: ${{ needs.flows-target.result }}
        run: |
          echo "flows-target: $RESULT"
          test "$RESULT" = success
