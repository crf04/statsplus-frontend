<!doctype html>
<!--
  PROTOTYPE, throwaway (branch prototype/share-cards). Question: what should the
  link-preview images look like for the pages that still unfurl with the bare
  logo (home, one Matchup, the Slate, Connect)? Three structurally different
  1200x630 cards per surface, shown raw and inside iMessage / X / Discord
  chrome. Data: the real 2026-10-24 production Slate (CourtAI MCP get_slate),
  copied by hand. The real cards would be drawn by the backend with Pillow, like
  app/services/game_log_preview.py, so everything here sticks to flat shapes and
  Barlow Condensed.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Share cards · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0d0b07; --surface: #16130d; --surface2: #1f1a12; --line: #342e22;
    --text: #efe9dc; --dim: #9b937f; --gold: #e8a33d; --hit: #4caf7d;
    --miss: #c24e4e; --logo: #f97316;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e6df; color: #1b1b1b; font-family: Inter, system-ui, sans-serif; }
  header.top { position: sticky; top: 0; z-index: 5; background: #111; color: #eee; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header.top b { font-family: 'Barlow Condensed'; font-size: 20px; letter-spacing: .3px; }
  header.top small { color: #999; }
  .seg { display: inline-flex; border: 1px solid #444; border-radius: 999px; overflow: hidden; }
  .seg button { background: none; border: 0; color: #ccc; padding: 6px 12px; font: 600 13px Inter; cursor: pointer; }
  .seg button.on { background: var(--logo); color: #fff; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px 14px 80px; }
  section.surface { margin-bottom: 44px; }
  section.surface > h2 { font: 700 26px 'Barlow Condensed'; margin: 6px 0 2px; }
  section.surface > p { margin: 0 0 14px; color: #555; font-size: 14px; }
  .variants { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 22px; }
  .variant h3 { font: 700 18px 'Barlow Condensed'; margin: 0 0 6px; }
  .variant h3 span { color: var(--logo); margin-right: 6px; }
  .variant .why { font-size: 13px; color: #555; margin: 6px 0 0; }

  /* scaled 1200x630 card */
  .frame { width: 100%; aspect-ratio: 1200 / 630; position: relative; overflow: hidden; container-type: inline-size; }
  .card { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; transform-origin: 0 0; transform: scale(calc(100cqw / 1200px)); }
  @supports not (transform: scale(calc(100cqw / 1200px))) { .card { transform: scale(var(--s, .46)); } }

  /* unfurl chrome */
  .chrome-raw .frame { border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .imsg { background: #fff; border-radius: 18px; padding: 10px; }
  .imsg .bubble { max-width: 420px; margin-left: auto; border-radius: 18px; overflow: hidden; background: #e9e9eb; }
  .imsg .meta { padding: 8px 12px 10px; font-family: -apple-system, system-ui, sans-serif; }
  .imsg .meta .t { font-weight: 600; font-size: 14px; color: #111; line-height: 1.25; }
  .imsg .meta .d { font-size: 13px; color: #888; }
  .xpost { background: #000; color: #e7e9ea; border-radius: 14px; padding: 12px 14px 14px; font-family: -apple-system, system-ui, sans-serif; }
  .xpost .who { font-size: 14px; margin-bottom: 8px; } .xpost .who b { color: #fff; } .xpost .who span { color: #71767b; }
  .xpost .img { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid #2f3336; }
  .xpost .pill { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.77); color: #fff; font-size: 13px; padding: 2px 6px; border-radius: 4px; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xpost .from { color: #71767b; font-size: 13px; margin-top: 4px; }
  .disc { background: #313338; border-radius: 8px; padding: 12px 14px; font-family: 'gg sans', 'Noto Sans', system-ui, sans-serif; }
  .disc .link { color: #00a8fc; font-size: 15px; margin-bottom: 6px; word-break: break-all; }
  .disc .embed { background: #2b2d31; border-left: 4px solid var(--logo); border-radius: 4px; padding: 10px 14px 14px; max-width: 432px; }
  .disc .site { color: #b5bac1; font-size: 12px; } .disc .t { color: #00a8fc; font-weight: 600; font-size: 15px; margin: 4px 0; }
  .disc .d { color: #dbdee1; font-size: 13.5px; line-height: 1.35; margin-bottom: 10px; }
  .disc .frame { border-radius: 4px; }

  /* card building blocks (all in 1200x630 px space) */
  .c { background: var(--ink); color: var(--text); font-family: 'Barlow Condensed', sans-serif; padding: 52px 64px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand .l { display: flex; align-items: center; gap: 16px; font: 600 40px 'Barlow Condensed'; }
  .brand .r { font: 600 30px 'Barlow Condensed'; color: var(--dim); }
  .logo { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex: none; }
  .logo svg { width: 100%; height: 100%; display: block; }
  .dim { color: var(--dim); } .gold { color: var(--gold); } .hit { color: var(--hit); } .miss { color: var(--miss); }
  .tile { background: var(--surface); border-radius: 14px; }
  .kicker { font: 600 26px 'Barlow Condensed'; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
  .rank { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 46px; padding: 0 10px; border-radius: 10px; font: 700 30px 'Barlow Condensed'; }
  .r-hot { background: rgba(76,175,125,.18); color: var(--hit); }
  .r-cold { background: rgba(194,78,78,.18); color: var(--miss); }
  .tri { font: 800 120px/0.9 'Barlow Condensed'; letter-spacing: -1px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<header class="top">
  <b>Share cards · prototype</b>
  <small>captured 2026-10-24 Slate · no sign-in</small>
  <span class="seg" id="chromeSeg"></span>
  <span class="seg" id="surfaceSeg"></span>
</header>
<main id="main"></main>

<script>
const LOGO = `<svg viewBox="0 0 512 512"><rect width="512" height="512" fill="#F97316"/><g transform="translate(256 256) scale(0.86) translate(-250 -298)"><g fill="#fff"><circle cx="225" cy="149" r="44"/><circle cx="388" cy="296" r="51"/></g><g stroke="#fff" stroke-width="38"><line x1="225" y1="185" x2="225" y2="352"/><line x1="122" y1="234" x2="225" y2="243"/><line x1="225" y1="252" x2="360" y2="290"/><line x1="225" y1="345" x2="138" y2="462"/><line x1="225" y1="345" x2="296" y2="462"/></g></g></svg>`;
const logo = (px = 56) => `<span class="logo" style="width:${px}px;height:${px}px;border-radius:${px * .21}px">${LOGO}</span>`;
const brand = (right = 'courtai.app') => `<div class="brand"><div class="l">${logo()}CourtAI</div><div class="r">${right}</div></div>`;
const sign = (n) => (n > 0 ? `+${n}%` : `${n}%`);

// --- captured data: production Slate 2026-10-24, points (PTS) Season Matchup Scores ---
const DATE_LONG = 'Saturday, Oct 24';
const GAMES = [
  ['MIA', 'CHA', 0], ['BKN', 'CLE', 4], ['MIL', 'PHI', 3], ['WAS', 'CHI', 0],
  ['SAS', 'DAL', 0], ['HOU', 'ATL', 0], ['NOP', 'DEN', 3], ['GSW', 'PHX', 1],
]; // away, home, players listed Out
const TOP = [
  { p: 'Jalen Smith', t: 'CHI', o: 'WAS', s: 9, slice: 'Catch & shoot', rank: 25 },
  { p: 'Matas Buzelis', t: 'CHI', o: 'WAS', s: 8, slice: 'Shots < 10 ft', rank: 30 },
  { p: 'Anthony Davis', t: 'WAS', o: 'CHI', s: 8, slice: 'PnR roll man', rank: 29 },
  { p: 'Alex Sarr', t: 'WAS', o: 'CHI', s: 8, slice: 'PnR roll man', rank: 29 },
  { p: 'Christian Braun', t: 'DEN', o: 'NOP', s: 7, slice: 'Transition', rank: 28 },
  { p: 'Jarrett Allen', t: 'CLE', o: 'BKN', s: 6, slice: 'Cuts', rank: 23 },
  { p: 'Josh Giddey', t: 'CHI', o: 'WAS', s: 6 },
  { p: 'Norman Powell', t: 'CHI', o: 'WAS', s: 5 },
  { p: 'Kyshawn George', t: 'WAS', o: 'CHI', s: 4 },
  { p: 'Nikola Jokić', t: 'DEN', o: 'NOP', s: 4 },
];
const bestIn = (a, h) => TOP.find((r) => [a, h].includes(r.t));

// ---------- HOME ----------
const homeA = () => `<div class="card c">
  ${brand(DATE_LONG + ' · 8 games')}
  <div style="display:flex;gap:56px;margin-top:40px;flex:1">
    <div style="flex:1.05;display:flex;flex-direction:column;justify-content:center">
      <div style="font:800 78px/0.98 'Barlow Condensed'">Every NBA prop,<br>read against<br><span class="gold">tonight's defense.</span></div>
      <div class="dim" style="font:600 30px 'Barlow Condensed';margin-top:22px">Game logs · Matchups · Lines · Injuries</div>
    </div>
    <div style="flex:.95;display:flex;flex-direction:column;gap:14px;justify-content:center">
      <div class="kicker">Tonight's best scoring matchups</div>
      ${TOP.slice(0, 3).map((r) => `<div class="tile" style="display:flex;align-items:center;padding:18px 24px;gap:18px">
        <div style="flex:1"><div style="font:700 40px 'Barlow Condensed'">${r.p}</div><div class="dim" style="font:600 24px 'Barlow Condensed'">${r.t} vs ${r.o} · ${r.slice}</div></div>
        <div class="hit" style="font:800 54px 'Barlow Condensed'">${sign(r.s)}</div></div>`).join('')}
    </div>
  </div></div>`;

const homeB = () => `<div class="card c" style="justify-content:space-between;background:radial-gradient(circle at 85% 20%, #3a230c 0, var(--ink) 55%)">
  <div style="display:flex;align-items:center;gap:30px;margin-top:40px">${logo(132)}<div style="font:800 150px/0.9 'Barlow Condensed';letter-spacing:-2px">CourtAI</div></div>
  <div style="font:600 50px/1.1 'Barlow Condensed';max-width:980px">NBA game logs, matchups and lines.<br><span class="dim">Ask in plain English — on the web, in Claude or ChatGPT.</span></div>
  <div>
    <div class="kicker" style="margin-bottom:12px">${DATE_LONG}</div>
    <div style="display:flex;gap:10px">${GAMES.map(([a, h]) => `<div class="tile" style="flex:1;text-align:center;padding:12px 0;font:700 28px 'Barlow Condensed'">${a}<span class="dim" style="font-weight:500"> @ </span>${h}</div>`).join('')}</div>
  </div></div>`;

// half-court shot zones, coloured by how much the night's softest defense allows
const court = (zones) => `<svg viewBox="0 0 500 470" width="500" height="470">
  <rect x="0" y="0" width="500" height="470" fill="#16130d" rx="14"/>
  <path d="M30 0 V140 A220 220 0 0 0 470 140 V0 Z" fill="${zones.mid}"/>
  <rect x="0" y="0" width="30" height="140" fill="${zones.corner}"/><rect x="470" y="0" width="30" height="140" fill="${zones.corner}"/>
  <path d="M30 140 A220 220 0 0 0 470 140 L500 140 V470 H0 V140 Z" fill="${zones.above}"/>
  <rect x="170" y="0" width="160" height="190" fill="${zones.paint}"/>
  <path d="M180 0 V50 A70 70 0 0 0 320 50 V0 Z" fill="${zones.ra}"/>
  <g fill="none" stroke="#0d0b07" stroke-width="5"><path d="M30 0 V140 A220 220 0 0 0 470 140 V0"/><rect x="170" y="0" width="160" height="190"/><path d="M180 0 V50 A70 70 0 0 0 320 50 V0"/><circle cx="250" cy="190" r="60"/></g>
  <circle cx="250" cy="22" r="10" fill="none" stroke="#efe9dc" stroke-width="4"/><line x1="220" y1="6" x2="280" y2="6" stroke="#efe9dc" stroke-width="4"/>
  <g font-family="Barlow Condensed" font-weight="800" text-anchor="middle" fill="#efe9dc">${zones.labels.map(([x, y, t, sz]) => `<text x="${x}" y="${y}" font-size="${sz}">${t}</text>`).join('')}</g>
</svg>`;
const heat = (pct) => (pct >= 15 ? '#2f8a5d' : pct >= 5 ? '#245a40' : pct > -5 ? '#2a251b' : pct > -15 ? '#5a2a2a' : '#8a3434');

const homeC = () => `<div class="card c" style="flex-direction:row;gap:56px;align-items:center">
  <div style="flex:1;display:flex;flex-direction:column;height:100%">
    ${brand('')}
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div class="kicker">Tonight · WAS defense</div>
      <div style="font:800 96px/0.95 'Barlow Condensed';margin:8px 0 16px"><span class="hit">+25%</span> at<br>the rim</div>
      <div class="dim" style="font:600 32px/1.2 'Barlow Condensed'">Restricted-area makes allowed vs league,<br>30th of 30. See who gets there — courtai.app</div>
    </div>
  </div>
  ${court({ ra: heat(25), paint: heat(-16), mid: heat(-10), corner: heat(3), above: heat(4),
    labels: [[250, 100, '+25%', 40], [250, 160, '−16%', 26], [100, 110, '−10%', 26], [250, 420, '+4%', 26]] })}
</div>`;

// ---------- MATCHUP: WAS @ CHI ----------
const side = (tri, city, players) => `<div style="flex:1;display:flex;flex-direction:column;gap:12px">
  <div><div class="tri">${tri}</div><div class="dim" style="font:600 28px 'Barlow Condensed';margin-top:6px">${city}</div></div>
  ${players.map(([p, s]) => `<div style="display:flex;align-items:center;gap:14px;font:700 34px 'Barlow Condensed'">
    <div style="flex:1">${p}</div><div style="width:${s * 22}px;height:16px;border-radius:8px;background:var(--hit)"></div><div class="hit" style="width:70px;text-align:right">${sign(s)}</div></div>`).join('')}
</div>`;
const matchupA = () => `<div class="card c">
  ${brand(DATE_LONG + ' · Matchup')}
  <div style="display:flex;gap:64px;margin-top:34px;flex:1;align-items:stretch">
    ${side('WAS', 'Wizards · away', [['Anthony Davis', 8], ['Alex Sarr', 8], ['Kyshawn George', 4]])}
    <div style="width:2px;background:var(--line);position:relative"><div style="position:absolute;top:30px;left:-30px;width:62px;height:62px;border-radius:50%;background:var(--ink);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 32px 'Barlow Condensed'" class="dim">@</div></div>
    ${side('CHI', 'Bulls · home', [['Jalen Smith', 9], ['Matas Buzelis', 8], ['Josh Giddey', 6]])}
  </div>
  <div class="dim" style="font:600 24px 'Barlow Condensed'">Points Matchup Score vs league · 7 of tonight's top 10 are in this game</div>
</div>`;

const diet = [['Catch & shoot', 54, 25, 8], ['Shots < 10 ft', 42, 30, 16], ['Pull-ups', 3, 2, -15]];
const matchupB = () => `<div class="card c">
  ${brand('WAS @ CHI · ' + DATE_LONG)}
  <div style="display:flex;gap:60px;margin-top:30px;flex:1">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div style="font:800 100px/0.9 'Barlow Condensed'">Jalen Smith</div>
      <div class="gold" style="font:600 36px 'Barlow Condensed';margin-top:8px">CHI vs WAS · Points</div>
      <div style="display:flex;align-items:baseline;gap:16px;margin-top:26px"><div class="hit" style="font:800 150px/0.85 'Barlow Condensed'">+9%</div><div class="dim" style="font:600 32px/1.1 'Barlow Condensed'">Matchup Score<br>vs league</div></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px">
      <div class="kicker">How he scores · where WAS ranks</div>
      ${diet.map(([n, share, rank, pct]) => `<div class="tile" style="padding:16px 22px">
        <div style="display:flex;align-items:center;gap:14px;font:700 34px 'Barlow Condensed'"><div style="flex:1">${n}</div><span class="rank ${pct > 0 ? 'r-hot' : 'r-cold'}">${rank}<span style="font-size:18px">/30</span></span></div>
        <div style="display:flex;align-items:center;gap:12px;margin-top:10px"><div style="flex:1;height:12px;background:#2a251b;border-radius:6px"><div style="width:${share}%;height:100%;border-radius:6px;background:var(--gold)"></div></div><div class="dim" style="font:600 24px 'Barlow Condensed';width:120px;text-align:right">${share}% of pts</div></div>
      </div>`).join('')}
    </div>
  </div></div>`;

const soft = (tri, rows) => `<div style="flex:1">
  <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:14px"><div style="font:800 64px/1 'Barlow Condensed'">${tri}</div><div class="kicker">defense allows</div></div>
  ${rows.map(([n, rank, pct]) => `<div style="display:flex;align-items:center;gap:18px;padding:9px 0;border-top:2px solid var(--line)">
    <span class="rank ${pct > 0 ? 'r-hot' : 'r-cold'}">${rank}</span>
    <div style="flex:1;font:700 38px 'Barlow Condensed'">${n}</div>
    <div class="${pct > 0 ? 'hit' : 'miss'}" style="font:800 44px 'Barlow Condensed'">${sign(pct)}</div></div>`).join('')}
</div>`;
const matchupC = () => `<div class="card c">
  ${brand('WAS @ CHI · ' + DATE_LONG)}
  <div style="display:flex;gap:70px;margin-top:30px;flex:1">
    ${soft('WAS', [['At the rim', 30, 25], ['Transition', 29, 19], ['Shots < 10 ft', 30, 16], ['Pull-ups', 2, -15]])}
    ${soft('CHI', [['Post-ups', 30, 46], ['PnR roll man', 29, 20], ['At the rim', 29, 18], ['Misc', 5, -12]])}
  </div>
  <div class="dim" style="font:600 24px 'Barlow Condensed'">Rank 1–30, 30 = allows the most · points allowed per 48 vs league</div>
</div>`;

// ---------- SLATE ----------
const slateA = () => `<div class="card c">
  ${brand(DATE_LONG)}
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px"><div style="font:800 64px/1 'Barlow Condensed'">Tonight's scoring matchups</div><div class="dim" style="font:600 28px 'Barlow Condensed'">8 games</div></div>
  <div style="display:flex;flex-direction:column;gap:20px;margin-top:10px">
  ${TOP.slice(0, 6).map((r, i) => `<div style="display:flex;align-items:center;gap:20px;font:700 34px 'Barlow Condensed'">
    <div class="dim" style="width:30px">${i + 1}</div><div style="width:290px">${r.p}</div><div class="dim" style="width:150px;font-weight:600">${r.t} v ${r.o}</div>
    <div style="flex:1;height:30px;background:#1a160f;border-radius:6px"><div style="width:${r.s * 10.5}%;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f6e4f,var(--hit))"></div></div>
    <div class="hit" style="width:80px;text-align:right">${sign(r.s)}</div></div>`).join('')}
  </div></div>`;

const slateB = () => `<div class="card c">
  ${brand(DATE_LONG + ' · Slate')}
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;flex:1">
  ${GAMES.map(([a, h, out]) => { const b = bestIn(a, h); return `<div class="tile" style="padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font:800 46px/1 'Barlow Condensed'">${a}<span class="dim" style="font-weight:500;font-size:32px"> @ </span>${h}</div>
      ${b ? `<div><div style="font:700 26px 'Barlow Condensed'">${b.p}</div><div class="hit" style="font:800 34px 'Barlow Condensed'">${sign(b.s)} pts</div></div>`
          : `<div class="dim" style="font:600 24px 'Barlow Condensed'">no top-10 edge</div>`}
      <div style="font:600 22px 'Barlow Condensed'" class="${out ? 'miss' : 'dim'}">${out ? out + ' listed Out' : 'No one Out'}</div>
    </div>`; }).join('')}
  </div></div>`;

const slateC = () => `<div class="card c" style="justify-content:space-between">
  ${brand(DATE_LONG)}
  <div style="display:flex;align-items:center;gap:60px">
    <div style="font:800 300px/0.8 'Barlow Condensed'" class="gold">7<span class="dim" style="font-size:120px">/10</span></div>
    <div style="font:700 60px/1.02 'Barlow Condensed'">of tonight's best scoring<br>matchups are in<br><span class="gold">one game: WAS @ CHI</span></div>
  </div>
  <div style="display:flex;gap:12px">${TOP.filter((r) => ['WAS', 'CHI'].includes(r.t)).map((r) => `<div class="tile" style="flex:1;padding:10px 0;text-align:center;font:700 24px 'Barlow Condensed'">${r.p.split(' ').at(-1)} <span class="hit">${sign(r.s)}</span></div>`).join('')}</div>
</div>`;

// ---------- CONNECT ----------
const connectA = () => `<div class="card c" style="flex-direction:row;gap:50px">
  <div style="flex:.9;display:flex;flex-direction:column">
    ${brand('')}
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div style="font:800 86px/0.95 'Barlow Condensed'">Ask Claude<br>about tonight's<br><span class="gold">NBA slate.</span></div>
      <div class="dim" style="font:600 30px 'Barlow Condensed';margin-top:18px">Add CourtAI to Claude or ChatGPT</div>
    </div>
  </div>
  <div style="flex:1.1;background:#f5f1e8;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px;font-family:Inter;color:#222">
    <div style="align-self:flex-end;background:#e4dccb;border-radius:18px;padding:14px 20px;font-size:26px;max-width:85%">Who has the best scoring matchup tonight?</div>
    <div style="font-size:27px;line-height:1.38"><b>Jalen Smith</b> (CHI vs WAS) leads at <b style="color:#2f8a5d">+9%</b> vs league — WAS ranks 25th in catch-and-shoot points allowed. Seven of the top ten are in WAS @ CHI.</div>
    <div style="margin-top:auto;display:flex;gap:10px;align-items:center;font-size:18px;color:#777">${logo(30)} CourtAI · get_slate</div>
  </div></div>`;

const connectB = () => `<div class="card c" style="justify-content:space-between">
  ${brand('Connect')}
  <div style="font:800 104px/0.95 'Barlow Condensed'">Your NBA research,<br>inside <span class="gold">Claude</span> and <span class="gold">ChatGPT</span>.</div>
  <div style="display:flex;flex-wrap:wrap;gap:12px">${['Tonight\'s slate', 'Matchups', 'Game logs vs any line', 'Injury report', 'Who plays when he sits', 'Rotations', 'Book & DFS lines'].map((t) => `<div class="tile" style="padding:12px 22px;font:700 30px 'Barlow Condensed'">${t}</div>`).join('')}</div>
</div>`;

const connectC = () => `<div class="card c">

       ['2', 'Sign in', 'Same CourtAI account'],
       ['3', 'Ask', '“Who benefits if Jokić sits?”']].map(([n, t, d]) => `<div class="tile" style="flex:1;padding:28px;display:flex;flex-direction:column;gap:14px">
        <div style="width:72px;height:72px;border-radius:50%;background:var(--logo);display:flex;align-items:center;justify-content:center;font:800 46px 'Barlow Condensed'">${n}</div>
        <div style="font:800 54px/1 'Barlow Condensed'">${t}</div><div class="dim" style="font:600 32px/1.15 'Barlow Condensed'">${d}</div></div>`).join('')}
  </div>

// ---------- ROUND 2: favourable AND unfavourable (user picked A for Matchup and Slate) ----------
// BKN @ CLE, points (PTS) Season Matchup Scores, from prod get_slate + get_matchup 2026-10-24.
const ord = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const GAME = { away: 'BKN', home: 'CLE', awayName: 'Nets', homeName: 'Cavaliers',
  awayP: [['Egor Dëmin', 3, 'Catch & shoot', 26], ['Michael Porter Jr.', 2, 'Catch & shoot', 26], ["Day'Ron Sharpe", -4, 'Shots < 10 ft', 6]],
  homeP: [['Jarrett Allen', 6, 'Cuts', 23], ['Evan Mobley', 3, 'Shots < 10 ft', 27], ['Donovan Mitchell', -5, 'PnR ball handler', 1], ['James Harden', -6, 'Pull-ups', 1]] };
const BOTTOM = [
  { p: 'Onyeka Okongwu', t: 'ATL', o: 'HOU', s: -6, slice: 'Spot up', rank: 3 },
  { p: 'Aaron Wiggins', t: 'ATL', o: 'HOU', s: -6, slice: 'Spot up', rank: 3 },
  { p: 'James Harden', t: 'CLE', o: 'BKN', s: -6, slice: 'Pull-ups', rank: 1 },
  { p: 'Donovan Mitchell', t: 'CLE', o: 'BKN', s: -5, slice: 'PnR ball handler', rank: 1 },
  { p: 'Nickeil Alexander-Walker', t: 'ATL', o: 'HOU', s: -5, slice: 'Catch & shoot', rank: 2 },
];
const col = (n) => (n > 0 ? 'var(--hit)' : 'var(--miss)');

// one diverging bar: centre axis, green grows right, red grows left
const dbar = (n, unit, h = 22) => `<div style="flex:1;display:flex;height:${h}px;position:relative">
  <div style="flex:1;display:flex;justify-content:flex-end">${n < 0 ? `<div style="width:${-n * unit}%;background:var(--miss);border-radius:${h / 2}px 0 0 ${h / 2}px"></div>` : ''}</div>
  <div style="width:3px;background:var(--line)"></div>
  <div style="flex:1">${n > 0 ? `<div style="width:${n * unit}%;height:100%;background:var(--hit);border-radius:0 ${h / 2}px ${h / 2}px 0"></div>` : ''}</div></div>`;

const sideDiv = (tri, name, ps) => `<div style="flex:1;display:flex;flex-direction:column;gap:22px">
  <div style="display:flex;align-items:baseline;gap:14px"><div class="tri" style="font-size:96px">${tri}</div><div class="dim" style="font:600 28px 'Barlow Condensed'">${name}</div></div>
  ${ps.map(([p, n]) => `<div style="display:flex;align-items:center;gap:10px;font:700 33px 'Barlow Condensed'">
    <div style="width:236px;white-space:nowrap">${p}</div>${dbar(n, 16, 28)}<div style="width:62px;text-align:right;color:${col(n)}">${sign(n)}</div></div>`).join('')}
</div>`;
const matchupA1 = () => `<div class="card c">
  ${brand(DATE_LONG + ' · Matchup')}
  <div style="display:flex;gap:40px;margin-top:22px;flex:1">
    ${sideDiv(GAME.away, GAME.awayName + ' · away', GAME.awayP)}
    <div style="width:2px;background:var(--line)"></div>
    ${sideDiv(GAME.home, GAME.homeName + ' · home', GAME.homeP)}
  </div>
  <div style="display:flex;justify-content:space-between;font:600 24px 'Barlow Condensed'"><span class="dim">Points Matchup Score vs league</span><span><span class="miss">◀ tougher</span> <span class="dim">·</span> <span class="hit">softer ▶</span></span></div>
</div>`;

const pick = ([p, n, slice, rank], opp) => `<div style="display:flex;align-items:center;gap:16px;padding:10px 0">
  <div style="flex:1"><div style="font:700 36px/1.05 'Barlow Condensed'">${p}</div><div class="dim" style="font:600 24px 'Barlow Condensed'">${slice} · ${opp} ${ord(rank)}</div></div>
  <div style="font:800 50px 'Barlow Condensed';color:${col(n)}">${sign(n)}</div></div>`;
const sideSplit = (tri, name, ps, opp) => {
  const up = ps.filter((x) => x[1] > 0), down = ps.filter((x) => x[1] < 0);
  return `<div style="flex:1;display:flex;flex-direction:column">
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:6px"><div class="tri" style="font-size:84px">${tri}</div><div class="dim" style="font:600 28px 'Barlow Condensed'">${name}</div></div>
    ${up.slice(0, 2).map((x) => pick(x, opp)).join('')}
    ${down.length ? `<div style="height:2px;background:var(--line);margin:4px 0"></div>${down.slice(-1).map((x) => pick(x, opp)).join('')}` : ''}
  </div>`;
};
const matchupA2 = () => `<div class="card c">
  ${brand(DATE_LONG + ' · Matchup')}
  <div style="display:flex;gap:64px;margin-top:14px;flex:1">
    ${sideSplit(GAME.away, GAME.awayName + ' · away', GAME.awayP, GAME.home)}

    ${sideSplit(GAME.home, GAME.homeName + ' · home', GAME.homeP, GAME.away)}

  <div class="dim" style="font:600 24px 'Barlow Condensed'">Points Matchup Score vs league · the defense's rank in his biggest slice (30th = allows the most)</div>
</div>`;

const slateRow = (r) => `<div style="display:flex;align-items:center;gap:18px;font:700 32px 'Barlow Condensed'">
  <div style="width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.p}</div><div class="dim" style="width:130px;font-weight:600">${r.t} v ${r.o}</div>
  ${dbar(r.s, 10.5, 24)}<div style="width:64px;text-align:right;color:${col(r.s)}">${sign(r.s)}</div></div>`;
const slateA1 = () => `<div class="card c">
  ${brand(DATE_LONG + ' · 8 games')}
  <div style="font:800 50px/1 'Barlow Condensed';margin:14px 0 12px">Tonight's scoring matchups, <span class="hit">softest</span> to <span class="miss">toughest</span></div>
  <div style="display:flex;flex-direction:column;gap:7px">
    ${TOP.slice(0, 4).map(slateRow).join('')}
    <div style="height:2px;background:var(--line);margin:4px 0"></div>
    ${BOTTOM.slice(0, 4).reverse().map(slateRow).join('')}
  </div></div>`;

const listCol = (title, cls, rows) => `<div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div class="kicker ${cls}" style="margin-bottom:6px">${title}</div>
  ${rows.map((r) => `<div style="display:flex;align-items:center;gap:14px;border-top:2px solid var(--line);padding-top:5px">
    <div style="flex:1;min-width:0"><div style="font:700 34px/1.05 'Barlow Condensed';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.p}</div>
    <div class="dim" style="font:600 22px 'Barlow Condensed'">${r.t} v ${r.o} · ${r.slice}, ${r.o} ${ord(r.rank)}</div></div>
    <div style="font:800 46px 'Barlow Condensed';color:${col(r.s)}">${sign(r.s)}</div></div>`).join('')}
</div>`;
const slateA2 = () => `<div class="card c">
  ${brand(DATE_LONG + ' · 8 games')}
  <div style="display:flex;gap:60px;margin-top:22px;flex:1">
    ${listCol('Softest scoring matchups', 'hit', TOP.slice(0, 5))}
    ${listCol('Toughest scoring matchups', 'miss', BOTTOM.slice(0, 5))}
  </div>
  <div class="dim" style="font:600 22px 'Barlow Condensed';margin-top:10px">Points Matchup Score vs league · the defense's rank in his biggest slice (30th = allows the most)</div>
</div>`;

// ---------- ROUND 3: how many players, and Slate B with both directions ----------
// Everyone the backend scores in BKN @ CLE (prod /api/games/slate/edges, 2026-10-24): 12 players.
// Only players with a points Matchup Score appear, so a game shows its targetable rotation, not 30 names.
const FULL = {
  away: [['Egor Dëmin', 3], ['Keon Ellis', 3], ['Michael Porter Jr.', 2], ['Julius Randle', 0.3], ["Day'Ron Sharpe", -4]],
  home: [['Jarrett Allen', 6], ['Evan Mobley', 3], ['Jaylon Tyson', 3], ['Peyton Watson', 0.4], ['Sam Merrill', -3], ['Donovan Mitchell', -5], ['James Harden', -6]],
};
const fmt = (n) => (Math.abs(n) < 1 ? (n > 0 ? '+0%' : '−0%') : sign(Math.round(n)));
const fullSide = (tri, name, ps, rowH) => `<div style="flex:1;display:flex;flex-direction:column;gap:${rowH > 50 ? 12 : 6}px">
  <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:4px"><div class="tri" style="font-size:72px">${tri}</div><div class="dim" style="font:600 26px 'Barlow Condensed'">${name}</div></div>
  ${ps.map(([p, n]) => `<div style="display:flex;align-items:center;gap:10px;font:700 ${rowH > 50 ? 32 : 28}px 'Barlow Condensed'">
    <div style="width:220px;white-space:nowrap">${p}</div>${dbar(n, 15, rowH > 50 ? 24 : 20)}<div style="width:58px;text-align:right;color:${Math.abs(n) < 1 ? 'var(--dim)' : col(n)}">${fmt(n)}</div></div>`).join('')}
</div>`;
const matchupFull = () => `<div class="card c">
  ${brand(DATE_LONG + ' · Matchup')}
  <div style="display:flex;gap:40px;margin-top:10px;flex:1">
    ${fullSide('BKN', 'Nets · away', FULL.away, 40)}
    <div style="width:2px;background:var(--line)"></div>
    ${fullSide('CLE', 'Cavaliers · home', FULL.home, 40)}
  </div>
  <div style="display:flex;justify-content:space-between;font:600 22px 'Barlow Condensed'"><span class="dim">Points Matchup Score vs league · all 12 scored players</span><span><span class="miss">◀ tougher</span> <span class="dim">·</span> <span class="hit">softer ▶</span></span></div>
</div>`;
// capped: per team the two softest and the two toughest at |score| >= 2%, then "+N more"
const cap = (ps) => {
  const up = ps.filter((x) => x[1] >= 2).slice(0, 2), down = ps.filter((x) => x[1] <= -2).slice(-2);
  return { rows: [...up, ...down], more: ps.length - up.length - down.length };
};
const capSide = (tri, name, ps) => { const c = cap(ps); return `<div style="flex:1;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;align-items:baseline;gap:12px"><div class="tri" style="font-size:88px">${tri}</div><div class="dim" style="font:600 28px 'Barlow Condensed'">${name}</div></div>
  ${c.rows.map(([p, n]) => `<div style="display:flex;align-items:center;gap:10px;font:700 34px 'Barlow Condensed'">
    <div style="width:236px;white-space:nowrap">${p}</div>${dbar(n, 16, 28)}<div style="width:58px;text-align:right;color:${col(n)}">${fmt(n)}</div></div>`).join('')}
  ${c.more ? `<div class="dim" style="font:600 26px 'Barlow Condensed'">+${c.more} more players</div>` : ''}
</div>`; };
const matchupCapped = () => `<div class="card c">
  ${brand(DATE_LONG + ' · Matchup')}
  <div style="display:flex;gap:40px;margin-top:18px;flex:1">
    ${capSide('BKN', 'Nets · away', FULL.away)}
    <div style="width:2px;background:var(--line)"></div>
    ${capSide('CLE', 'Cavaliers · home', FULL.home)}
  </div>
  <div style="display:flex;justify-content:space-between;font:600 24px 'Barlow Condensed'"><span class="dim">Points Matchup Score vs league · up to 2 each way per team</span><span><span class="miss">◀ tougher</span> <span class="dim">·</span> <span class="hit">softer ▶</span></span></div>
</div>`;

// Slate B with both directions: per game, the softest and toughest points score at |score| >= 2%.
const BOARD = [
  ['MIA', 'CHA', '6:00', ['Naz Reid', 'CHA', 4], ['Bam Adebayo', 'MIA', -3], 0],
  ['BKN', 'CLE', '7:30', ['Jarrett Allen', 'CLE', 6], ['James Harden', 'CLE', -6], 4],
  ['MIL', 'PHI', '7:30', null, ['Tyler Herro', 'MIL', -3], 3],
  ['WAS', 'CHI', '8:00', ['Jalen Smith', 'CHI', 9], null, 0],
  ['SAS', 'DAL', '8:00', 'none', 'none', 0],
  ['HOU', 'ATL', '8:30', ['Alperen Şengün', 'HOU', 3], ['Onyeka Okongwu', 'ATL', -6], 0],
  ['NOP', 'DEN', '9:00', ['Christian Braun', 'DEN', 7], null, 3],
  ['GSW', 'PHX', '10:00', null, null, 1],
];
const edgeLine = (e, dir) => e === 'none' ? '' : e
  ? `<div style="display:flex;align-items:baseline;gap:8px"><div style="flex:1;font:700 26px 'Barlow Condensed';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e[0]} <span class="dim" style="font-weight:600;font-size:20px">${e[1]}</span></div><div style="font:800 32px 'Barlow Condensed';color:${col(e[2])}">${sign(e[2])}</div></div>`
  : `<div class="dim" style="font:600 22px/32px 'Barlow Condensed'">${dir > 0 ? 'nothing above +2%' : 'nothing below −2%'}</div>`;
const slateBpm = () => `<div class="card c">
  ${brand(DATE_LONG + ' · 8 games · ET')}
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;flex:1">
  ${BOARD.map(([a, h, tip, up, down, out]) => `<div class="tile" style="padding:16px 18px;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px"><div style="font:800 40px/1 'Barlow Condensed'">${a}<span class="dim" style="font-weight:500;font-size:28px"> @ </span>${h}</div><div class="dim" style="font:600 22px 'Barlow Condensed'">${tip}</div></div>
      ${up === 'none' ? `<div class="dim" style="font:600 22px 'Barlow Condensed'">No scores yet</div>` : edgeLine(up, 1) + edgeLine(down, -1)}
      <div style="margin-top:auto;font:600 20px 'Barlow Condensed'" class="${out ? 'miss' : 'dim'}">${out ? out + ' listed Out' : 'No one Out'}</div>
    </div>`).join('')}
  </div>
  <div class="dim" style="font:600 22px 'Barlow Condensed';margin-top:12px">Softest and toughest points Matchup Score per game, vs league</div>
</div>`;

const SURFACES = [
  { key: 'matchup', name: 'Matchup · /matchups/:gameId', note: 'Round 2: A with both directions. Example: BKN @ CLE, the one game tonight with clear edges both ways.',
    title: 'BKN @ CLE · Matchup | CourtAI', desc: 'Allen +6% in points vs league; Harden −6%, Mitchell −5%.', url: 'courtai.app/matchups/BKN-CLE',
    post: 'BKN @ CLE tonight: Jarrett Allen gets a Brooklyn defense that ranks 23rd vs cuts. Harden and Mitchell run into the league\'s best pull-up and PnR ball-handler D.',
    v: [['A1·all', 'Everyone (12 players)', 'Every player the backend scores in this game. 12 is a real game tonight; a game shows only players with a points score, so the busiest nights land around 12–16.', matchupFull],
        ['A1·cap', 'Capped: 2 each way per team', 'At most two softest and two toughest per team, only beyond ±2%, then “+N more players”. Same size every night.', matchupCapped],
        ['A2', 'Best and worst, with reasons', 'Round 2, for comparison.', matchupA2]] },
  { key: 'slate', name: 'Slate · /matchups', note: 'Round 2: A with both directions. Doubles as the daily X post image.',
    title: 'Saturday\'s Slate · 8 games | CourtAI', desc: 'Softest and toughest scoring matchups across 8 games.', url: 'courtai.app/matchups',
    post: 'Saturday, 8 games. Softest scoring spots: WAS @ CHI has 7 of the top 10. Toughest: Atlanta\'s shooters vs Houston (2nd vs catch-and-shoot, 3rd vs spot-ups).',
    v: [['B±', 'Board grid, both directions', 'Every game with tip time, its softest and toughest points score (beyond ±2%) and how many are Out. 8 games fill the grid; a 15-game night needs a 5×3 grid or two cards.', slateBpm],
        ['B', 'Round 1 board grid', 'Favourable only, for comparison.', slateB],
        ['A2', 'Two columns', 'Round 2, for comparison.', slateA2]] },
  { key: 'home', name: 'Home · courtai.app', note: 'The most-shared link. Today: logo-only summary card.',
    title: 'CourtAI | NBA Game Log Analytics', desc: 'Every NBA prop, read against tonight\'s defense.', url: 'courtai.app',
    v: [['A', 'Pitch + tonight', 'Evergreen pitch on the left, three live matchups on the right. Changes daily.', homeA],
        ['B', 'Brand poster', 'Big wordmark, tonight\'s games as a strip. Least data, most recognisable.', homeB],
        ['C', 'One striking fact', 'The night\'s single loudest defensive weakness on a court diagram. A hook, not a summary.', homeC]] },
  { key: 'connect', name: 'Connect · /connect', note: 'The MCP funnel; static card, no endpoint needed.',
    title: 'Connect CourtAI to Claude or ChatGPT', desc: 'Ask about tonight\'s slate, matchups, injuries and lines.', url: 'courtai.app/connect',
    v: [['A', 'Chat demo', 'A real question and answer, so the card shows the product working.', connectA],
        ['B', 'Capability list', 'Headline plus the tools as chips.', connectB],
        ['C', 'Three steps', 'How to connect, with the URL big enough to type.', connectC]] },
];

const params = new URLSearchParams(location.search);
let chrome = params.get('chrome') || 'raw';
let only = params.get('s') || 'all';

const wrap = (s, card) => {
  const frame = `<div class="frame">${card}</div>`;
  if (chrome === 'imessage') return `<div class="imsg"><div class="bubble">${frame}<div class="meta"><div class="t">${s.title}</div><div class="d">${s.url.split('/')[0]}</div></div></div></div>`;
  if (chrome === 'x') return `<div class="xpost"><div class="who"><b>CourtAI</b> <span>@courtai · 2m</span></div>${s.post ? `<div style="font-size:15px;line-height:1.35;margin:-2px 0 10px">${s.post}</div>` : ''}<div class="img">${frame}<div class="pill">${s.url.split('/')[0]}</div></div><div class="from">From ${s.url.split('/')[0]}</div></div>`;
  if (chrome === 'discord') return `<div class="disc"><div class="link">https://${s.url}</div><div class="embed"><div class="site">CourtAI</div><div class="t">${s.title}</div><div class="d">${s.desc}</div>${frame}</div></div>`;
  return `<div class="chrome-raw">${frame}</div>`;
};

function render() {
  const url = new URL(location.href);
  url.searchParams.set('chrome', chrome); url.searchParams.set('s', only);
  history.replaceState(null, '', url);
  document.getElementById('chromeSeg').innerHTML = [['raw', 'Raw 1200×630'], ['imessage', 'iMessage'], ['x', 'X'], ['discord', 'Discord']]
    .map(([k, l]) => `<button class="${k === chrome ? 'on' : ''}" data-chrome="${k}">${l}</button>`).join('');
  document.getElementById('surfaceSeg').innerHTML = [['all', 'All'], ...SURFACES.map((s) => [s.key, s.key[0].toUpperCase() + s.key.slice(1)])]
    .map(([k, l]) => `<button class="${k === only ? 'on' : ''}" data-s="${k}">${l}</button>`).join('');
  const current = `<section class="surface"><h2>For reference: today's Game Logs card</h2><p>Shipped in #285. New cards should look like siblings of this one.</p>
    <div class="variants"><div class="variant">${wrap({ title: 'Jalen Brunson Game Logs | CourtAI', desc: 'Every logged game. Explore on CourtAI.', url: 'courtai.app/?player_name=Jalen+Brunson' }, '<img src="current-gamelog.png" style="width:100%;display:block">')}</div></div></section>`;
  document.getElementById('main').innerHTML = SURFACES.filter((s) => only === 'all' || s.key === only).map((s) => `
    <section class="surface" id="${s.key}"><h2>${s.name}</h2><p>${s.note}</p><div class="variants">
      ${s.v.map(([k, n, why, fn]) => `<div class="variant"><h3><span>${k}</span>${n}</h3>${wrap(s, fn())}<p class="why">${why}</p></div>`).join('')}
    </div></section>`).join('') + (only === 'all' ? current : '');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.chrome) chrome = b.dataset.chrome;
  if (b.dataset.s) only = b.dataset.s;
  render();
});
render();
</script>
