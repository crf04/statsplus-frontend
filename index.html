<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CourtAI helps explore NBA player game logs with advanced filters, natural language search, and performance analytics."
    />
    <meta name="theme-color" content="#0d0b07" />
    <!-- The visitor's theme before anything paints: the rule of src/theme/themeStore.js. -->
    <script>
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem('courtai:theme');
        } catch (error) {}
        var light =
          preference === 'light' ||
          (preference !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', light ? '#f3f4f6' : '#0d0b07');
      })();
    </script>
    <title>CourtAI | NBA Game Log Analytics</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CourtAI" />
    <meta property="og:title" content="CourtAI | NBA Game Log Analytics" />
    <meta
      property="og:description"
      content="CourtAI helps explore NBA player game logs with advanced filters, natural language search, and performance analytics."
    />
    <meta property="og:image" content="https://courtai.app/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CourtAI | NBA Game Log Analytics" />
    <meta
      name="twitter:description"
      content="CourtAI helps explore NBA player game logs with advanced filters, natural language search, and performance analytics."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
